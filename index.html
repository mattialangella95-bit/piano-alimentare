function applyTheme(key){
  const t = THEMES[key] || THEMES.foresta;
  const r = document.documentElement.style;
  r.setProperty('--forest', t.forest);
  r.setProperty('--forest-deep', t.deep);
  r.setProperty('--clay', t.clay);
  r.setProperty('--gold', t.gold);
  r.setProperty('--tint', t.tint || mixWithWhite(t.forest, 0.13));
  r.setProperty('--tint-soft', t.tintSoft || mixWithWhite(t.forest, 0.07));
  r.setProperty('--tint-line', t.tintLine || mixWithWhite(t.forest, 0.3));
}
// Versione chiara di un colore: amount 0 = bianco, 1 = colore pieno
function mixWithWhite(hex, amount){
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255]
    .map(c => Math.round(255 - (255 - c) * amount).toString(16).padStart(2, '0')).join('');
}
// Da chiamare dopo aver cambiato "profile": aggiorna calendario e colori
function applyProfile(prevStart){
  setStartDate(profile.startDate);
  applyTheme(profile.theme);
  if(prevStart !== profile.startDate) goToToday();
}
function avatarLetter(){
  const s = (profile.name || (currentUser && currentUser.email) || '?').trim();
  return (s.charAt(0) || '?').toUpperCase();
}
function renderAvatar(){
  document.getElementById('profileBtn').textContent = avatarLetter();
}

function renderProfile(){
  const ingredients = planData.reduce((a, w) => a + w.days.reduce((b, d) => b + MEAL_TYPES.reduce((c, m) => c + d.meals[m].length, 0), 0), 0);
  const start = parseISODate(profile.startDate);
  profileSheet.innerHTML = `
    <div class="profile-head">
      <div class="avatar big">${escapeHtml(avatarLetter())}</div>
      <div class="profile-id">
        <input class="profile-name" id="profileName" type="text" placeholder="Il tuo nome" value="${escapeHtml(profile.name)}" autocomplete="given-name">
        <div class="profile-email">${escapeHtml(currentUser ? currentUser.email : '')}</div>
        <div class="profile-exit" data-logout>Esci dall'account</div>
      </div>
    </div>
    <div class="profile-stats">
      <div><b>${ingredients}</b><span>ingredienti nel piano</span></div>
      <div><b>${weekCompleted.filter(Boolean).length}/${planData.length}</b><span>settimane completate</span></div>
      <div><b>${todayIdx ? 'S' + (todayIdx.week + 1) : '–'}</b><span>settimana di oggi</span></div>
    </div>
    ${isAdmin ? `<h5>📬 Segnalazioni ricevute<span class="fb-count" id="fbCount"></span></h5><div id="fbAdmin"><div class="sheet-hint">Carico…</div></div>` : ''}

    <h5>Colori</h5>
    <div class="theme-row">${Object.entries(THEMES).map(([key, t]) => `
      <div class="theme-opt${profile.theme === key ? ' active' : ''}" data-theme-key="${key}">
        <span class="theme-dot" style="background:linear-gradient(135deg, ${t.forest} 0 55%, ${t.clay} 55% 100%)"></span>
        <span>${t.label}</span>
      </div>`).join('')}
    </div>

    <h5>Personalizza</h5>
    <input class="profile-input" id="profileTitle" type="text" value="${escapeHtml(appTitle)}" placeholder="Titolo dell'app">
    <textarea class="profile-input" id="profileNotes" rows="3" placeholder="Note da vedere sotto il piano">${escapeHtml(profile.notes)}</textarea>

    <h5>Inizio del piano</h5>
    <input class="profile-input" type="date" id="profileStart" value="${escapeHtml(profile.startDate)}">
    <div class="profile-hint">Settimana 1 parte lunedì ${fullDateLabel(start)} ${start.getFullYear()}. Il piano ricomincia da capo ogni 4 settimane.</div>

    <h5>Password</h5>
    <div class="profile-pw">
      <input class="profile-input" type="password" id="newPassword" placeholder="Nuova password (min. 6 caratteri)" autocomplete="new-password">
      <div class="profile-btn" id="changePwBtn">Cambia</div>
    </div>
    <div class="profile-msg" id="pwMsg"></div>

    <h5>I tuoi dati</h5>
    <div class="profile-link" id="exportDataLink">⬇️ Esporta backup</div>
    <div class="profile-link" id="importDataLink">⬆️ Importa backup</div>
    <div class="profile-link danger" id="resetPlanLink">Svuota il piano (cancella tutti i pasti)</div>
    <div class="profile-logout" id="logoutLink" data-logout>Esci dall'account</div>
    <div class="sheet-close" id="profileCloseBtn">Chiudi</div>`;
  if(isAdmin) loadAdminReports();
}
function openProfile(){ renderProfile(); profileOverlay.classList.remove('hidden'); checkAdmin(); }
function closeProfile(){ profileOverlay.classList.add('hidden'); }
function refreshProfileIfOpen(){
  if(profileOverlay.classList.contains('hidden')) return;
  if(profileSheet.contains(document.activeElement) && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; // non disturbare chi sta scrivendo
  renderProfile();
}
function profileMsg(text, ok){
  const el = document.getElementById('pwMsg');
  if(!el) return;
  el.textContent = text;
  el.className = 'profile-msg' + (ok ? ' ok' : '');
}

async function changePassword(){
  const input = document.getElementById('newPassword');
  const pw = input.value;
  if(pw.length < 6) return profileMsg('La password deve avere almeno 6 caratteri.');
  if(!navigator.onLine) return profileMsg('Serve internet per cambiare la password.');
  profileMsg('Cambio la password…', true);
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){
    const m = (error.message || '').toLowerCase();
    if(m.includes('different')) return profileMsg('La nuova password deve essere diversa da quella attuale.');
    if(m.includes('reauth')) return profileMsg('Per sicurezza esci, rientra e riprova.');
    return profileMsg(authErrorText(error));
  }
  input.value = '';
  profileMsg('Password cambiata ✓', true);
}

function exportBackup(){
  const payload = { ...currentState(), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `piano_backup_${toISODate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const saved = JSON.parse(reader.result);
      if(saved && Array.isArray(saved.planData) && saved.planData.length === planData.length){
        showConfirm('Importare questo backup? I dati attualmente presenti nell\'app verranno sostituiti.', () => {
          applyState({ appTitle, appSubtitle, profile, ...saved });
          saveState();
          refreshUI();
        });
      } else {
        showAlert('Il file selezionato non sembra un backup valido di questa app.');
      }
    }catch(err){
      showAlert('Impossibile leggere questo file: non è un backup JSON valido.');
    }
  };
  reader.readAsText(file);
}
function confirmEmptyPlan(){
  showConfirm('Vuoi davvero cancellare tutti i pasti di tutte le settimane? Questa azione non si può annullare.', () => {
    applyState({ appTitle, appSubtitle, profile, cycle: currentCycle });
    saveState();
    refreshUI();
  }, 'Sì, svuota');
}

function initProfile(){
  document.getElementById('profileBtn').addEventListener('click', openProfile);
  profileOverlay.addEventListener('click', (e) => { if(e.target === profileOverlay) closeProfile(); });
  importFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importBackupFile(file);
    importFileInput.value = '';
  });
  profileSheet.addEventListener('click', (e) => {
    const fbToggle = e.target.closest('[data-fb-toggle]');
    if(fbToggle) return adminSetState(Number(fbToggle.dataset.fbToggle), fbToggle.dataset.fbNext);
    const fbDel = e.target.closest('[data-fb-del]');
    if(fbDel) return adminDelete(Number(fbDel.dataset.fbDel));
    const theme = e.target.closest('[data-theme-key]');
    if(theme){
      profile.theme = theme.getAttribute('data-theme-key');
      applyTheme(profile.theme);
      saveState();
      renderProfile();
      return;
    }
    if(e.target.closest('#changePwBtn')) return changePassword();
    if(e.target.closest('#exportDataLink')) return exportBackup();
    if(e.target.closest('#importDataLink')) return importFileInput.click();
    if(e.target.closest('#resetPlanLink')) return confirmEmptyPlan();
    if(e.target.closest('[data-logout]')){ closeProfile(); return logout(); }
    if(e.target.closest('#profileCloseBtn')) return closeProfile();
  });
  profileSheet.addEventListener('input', (e) => {
    const id = e.target.id;
    if(id === 'profileName'){
      profile.name = e.target.value.trim();
      renderTitles();
      profileSheet.querySelector('.avatar.big').textContent = avatarLetter();
    } else if(id === 'profileTitle'){
      appTitle = e.target.value.trim() || DEFAULT_TITLE;
      renderTitles();
    } else if(id === 'profileNotes'){
      profile.notes = e.target.value;
      if(currentTab === 'piano') renderMain();
    } else return;
    saveState();
  });
  profileSheet.addEventListener('change', (e) => {
    if(e.target.id !== 'profileStart' || !e.target.value) return;
    const prevStart = profile.startDate;
    profile.startDate = toISODate(mondayOf(parseISODate(e.target.value))); // il piano parte sempre di lunedì
    applyProfile(prevStart);
    saveState();
    renderAll();
    renderProfile();
  });
}

// ---------- SEGNALAZIONI: la nuvoletta 💬 per scrivere bug e idee a Lænx ----------
// Tabelle "segnalazioni" e "amministratori" su Supabase (vedi segnalazioni.sql): ognuno legge le sue, l'amministratore tutte
let isAdmin = false;
let fbTipo = 'bug';
let fbEditing = null;  // id della segnalazione che si sta modificando
let myReports = [];
const FB_TIPI = { bug: '🐞 Qualcosa non va', idea: '💡 Un\'idea' };

// Si controlla all'accesso e ogni volta che si apre il Profilo (così non serve riaprire l'app)
async function checkAdmin(){
  if(!currentUser || !navigator.onLine) return;
  const uid = currentUser.id;
  const { data, error } = await sb.from('amministratori').select('user_id').eq('user_id', uid).maybeSingle();
  if(error || !currentUser || currentUser.id !== uid) return;
  const was = isAdmin;
  isAdmin = !!data;
  if(was !== isAdmin) refreshProfileIfOpen();
}
function deviceName(){
  const ua = navigator.userAgent;
  return /android/i.test(ua) ? 'Android' : /iphone|ipad/i.test(ua) ? 'iPhone' : 'Computer';
}
// Dove si trovava chi scrive: aiuta a capire il bug
function whereAmI(){
  const week = planData[currentWeek];
  const place = currentTab === 'piano' ? `Piano · ${week.name} · ${week.days[currentDay].name}` : `Lista spesa (${shopMode}) · ${week.name}`;
  return `${place} · ${deviceName()}`;
}
function fbDate(iso){
  const d = new Date(iso);
  return `${d.getDate()} ${MONTHS_IT_SHORT[d.getMonth()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function reportHTML(r, admin){
  return `
    <div class="fb-item${r.stato === 'fatta' ? ' done' : ''}">
      <div class="fb-top">
        <span>${r.tipo === 'idea' ? '💡' : '🐞'} ${escapeHtml(fbDate(r.creato))}${admin ? ` · ${escapeHtml(r.email || '')}` : ''}</span>
        <span class="fb-right">
          <span class="fb-state">${r.stato === 'fatta' ? 'Fatta ✓' : 'Nuova'}</span>
          ${admin ? '' : `${r.stato !== 'fatta' ? `<span class="fb-icon" data-fb-edit="${r.id}" role="button" aria-label="Modifica">✏️</span>` : ''}<span class="fb-icon" data-fb-mydel="${r.id}" role="button" aria-label="Elimina">🗑</span>`}
        </span>
      </div>
      <div class="fb-text">${escapeHtml(r.testo)}</div>
      ${admin ? `
      <div class="fb-where">${escapeHtml(r.pagina || '')}</div>
      <div class="fb-actions">
        <div class="copy-btn" data-fb-toggle="${r.id}" data-fb-next="${r.stato === 'fatta' ? 'nuova' : 'fatta'}">${r.stato === 'fatta' ? '↺ Riapri' : '✓ Fatta'}</div>
        <div class="copy-btn fb-del" data-fb-del="${r.id}">🗑 Elimina</div>
      </div>` : ''}
    </div>`;
}

function openFeedback(){
  if(!currentUser) return;
  infoSheet.innerHTML = `
    <h4>Scrivi a Lænx</h4>
    <div class="sheet-sub">Bug e correzioni: scrivine una alla volta, così non si perde niente.</div>
    <div class="chip-row">${Object.entries(FB_TIPI).map(([k, l]) => `<div class="chip${fbTipo === k ? ' active' : ''}" data-fb-tipo="${k}">${l}</div>`).join('')}</div>
    <textarea class="profile-input fb-text" id="fbText" rows="3" maxlength="2000" placeholder="Cosa è successo e dove?"></textarea>
    <div class="profile-msg" id="fbMsg"></div>
    <div class="sheet-close edit-save" id="fbSend">Invia</div>
    <div class="sheet-cancel fb-cancel-edit" id="fbCancelEdit" hidden>Annulla modifica</div>
    <h5>Le tue segnalazioni</h5>
    <div id="fbMine"><div class="sheet-hint">Carico…</div></div>
    <div class="sheet-cancel" id="fbClose">Chiudi</div>`;
  infoOverlay.classList.remove('hidden');
  infoSheet.querySelectorAll('[data-fb-tipo]').forEach(chip => chip.addEventListener('click', () => {
    fbTipo = chip.dataset.fbTipo;
    infoSheet.querySelectorAll('[data-fb-tipo]').forEach(c => c.classList.toggle('active', c === chip));
  }));
  document.getElementById('fbSend').addEventListener('click', sendFeedback);
  document.getElementById('fbClose').addEventListener('click', hideInfoSheet);
  document.getElementById('fbCancelEdit').addEventListener('click', stopEditReport);
  document.getElementById('fbMine').addEventListener('click', onMyReportClick);
  fbEditing = null;
  loadMyReports();
}
// ✏️ e 🗑 sulle proprie segnalazioni (il 🗑 chiede "Elimina?" e cancella al secondo tocco)
function onMyReportClick(e){
  const edit = e.target.closest('[data-fb-edit]');
  if(edit){
    const r = myReports.find(x => x.id === Number(edit.dataset.fbEdit));
    if(r) startEditReport(r);
    return;
  }
  const del = e.target.closest('[data-fb-mydel]');
  if(!del) return;
  if(!del.classList.contains('armed')){
    del.classList.add('armed');
    del.textContent = 'Elimina?';
    setTimeout(() => { if(del.isConnected){ del.classList.remove('armed'); del.textContent = '🗑'; } }, 3000);
    return;
  }
  deleteMyReport(Number(del.dataset.fbMydel));
}
function startEditReport(r){
  fbEditing = r.id;
  fbTipo = r.tipo;
  const box = document.getElementById('fbText');
  box.value = r.testo;
  infoSheet.querySelectorAll('[data-fb-tipo]').forEach(c => c.classList.toggle('active', c.dataset.fbTipo === fbTipo));
  document.getElementById('fbSend').textContent = 'Salva modifica';
  document.getElementById('fbCancelEdit').hidden = false;
  fbMsg('');
  infoSheet.scrollTop = 0;
  box.focus();
}
function stopEditReport(){
  fbEditing = null;
  document.getElementById('fbText').value = '';
  document.getElementById('fbSend').textContent = 'Invia';
  document.getElementById('fbCancelEdit').hidden = true;
}
async function deleteMyReport(id){
  if(!navigator.onLine) return fbMsg('Serve internet per eliminarla.');
  const { data, error } = await sb.from('segnalazioni').delete().eq('id', id).select('id');
  if(error || !data || !data.length) return fbMsg('Non sono riuscito a eliminarla: riprova tra poco.');
  if(fbEditing === id) stopEditReport();
  fbMsg('Eliminata.', true);
  loadMyReports();
}
function fbMsg(text, ok){
  const el = document.getElementById('fbMsg');
  if(!el) return;
  el.textContent = text;
  el.className = 'profile-msg' + (ok ? ' ok' : '');
}
async function sendFeedback(){
  const box = document.getElementById('fbText');
  const testo = box.value.trim();
  if(!testo) return fbMsg('Scrivi prima cosa vuoi segnalare.');
  if(!navigator.onLine) return fbMsg('Serve internet per inviare: il testo resta qui, riprova tra poco.');
  const btn = document.getElementById('fbSend');
  btn.style.pointerEvents = 'none';
  if(fbEditing){
    fbMsg('Salvo…', true);
    const { data, error } = await sb.from('segnalazioni').update({ tipo: fbTipo, testo }).eq('id', fbEditing).select('id');
    btn.style.pointerEvents = '';
    if(error) return fbMsg('Non sono riuscito a salvarla: riprova tra poco. Il testo resta qui.');
    if(!data || !data.length) return fbMsg('Non si può più modificare: forse Lænx l\'ha già segnata come fatta.');
    stopEditReport();
    fbMsg('Modificata ✓', true);
    loadMyReports();
    return;
  }
  fbMsg('Invio…', true);
  const { error } = await sb.from('segnalazioni').insert({ tipo: fbTipo, testo, pagina: whereAmI() });
  btn.style.pointerEvents = '';
  if(error) return fbMsg('Non sono riuscito a inviarla: riprova tra poco. Il testo resta qui.');
  box.value = '';
  fbMsg('Inviata, grazie! 🙏', true);
  loadMyReports();
}
async function loadMyReports(){
  if(!currentUser || !document.getElementById('fbMine')) return;
  const { data, error } = await sb.from('segnalazioni').select('id, tipo, testo, stato, creato')
    .eq('user_id', currentUser.id).order('creato', { ascending: false }).limit(30);
  const box = document.getElementById('fbMine');
  if(!box) return;
  if(error){ box.innerHTML = `<div class="sheet-hint">${navigator.onLine ? 'Non riesco a caricarle adesso.' : 'Senza internet non posso mostrarle.'}</div>`; return; }
  myReports = data;
  box.innerHTML = data.length ? data.map(r => reportHTML(r, false)).join('') : '<div class="sheet-hint">Ancora nessuna.</div>';
}
async function loadAdminReports(){
  const { data, error } = await sb.from('segnalazioni').select('id, email, tipo, testo, pagina, stato, creato')
    .order('creato', { ascending: false }).limit(200);
  const box = document.getElementById('fbAdmin');
  if(!box) return;
  if(error){ box.innerHTML = '<div class="sheet-hint">Non riesco a caricarle adesso.</div>'; return; }
  const open = data.filter(r => r.stato !== 'fatta');
  document.getElementById('fbCount').textContent = open.length ? ` · ${open.length} da vedere` : '';
  const sorted = open.concat(data.filter(r => r.stato === 'fatta')); // prima quelle da fare
  box.innerHTML = sorted.length ? sorted.map(r => reportHTML(r, true)).join('') : '<div class="sheet-hint">Nessuna segnalazione per ora.</div>';
}
async function adminSetState(id, stato){
  const { error } = await sb.from('segnalazioni').update({ stato }).eq('id', id);
  if(error) showToast('Non riesco a salvarla adesso');
  loadAdminReports();
}
function adminDelete(id){
  showConfirm('Eliminare questa segnalazione?', async () => {
    const { error } = await sb.from('segnalazioni').delete().eq('id', id);
    if(error) showToast('Non riesco a eliminarla adesso');
    loadAdminReports();
  }, 'Sì, elimina');
}
document.getElementById('fbFab').addEventListener('click', openFeedback);

// ---------- TASTO INDIETRO (Android): chiude schede e pannelli invece di uscire dall'app ----------
// In cronologia c'è sempre una "pagina di guardia": ogni "indietro" la consuma, noi chiudiamo quello
// che è aperto e la rimettiamo. Dalla schermata principale serve un secondo "indietro" per uscire.
let exitArmed = false;
function armBackGuard(){ history.pushState({ pianoGuard: true }, ''); }
function closeTopLayer(){
  if(!document.getElementById('authScreen').hidden) return false;
  if(!infoOverlay.classList.contains('hidden')){ hideInfoSheet(); return true; }
  if(!profileOverlay.classList.contains('hidden')){ closeProfile(); return true; }
  if(currentTab !== 'piano'){ switchTab('piano'); return true; }
  return false;
}
window.addEventListener('popstate', () => {
  if(closeTopLayer()){ armBackGuard(); return; }
  if(exitArmed) return;
  exitArmed = true;
  showToast('Premi ancora indietro per uscire');
  setTimeout(() => { if(exitArmed){ exitArmed = false; armBackGuard(); } }, 2500);
});

const appTitleEl = document.getElementById("appTitle");
const appSubtitleEl = document.getElementById("appSubtitle");
function renderTitles(){
  appTitleEl.textContent = appTitle;
  appSubtitleEl.textContent = profile.name ? `Ciao ${profile.name}` : 'Il tuo piano settimanale';
  renderAvatar();
}
function refreshUI(){ renderTitles(); renderAll(); refreshProfileIfOpen(); }
initProfile();
refreshUI();
initAuth();
armBackGuard();

// Registra il service worker per aggiornamenti automatici e uso offline
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
